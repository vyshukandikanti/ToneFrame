version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: dubverse-postgres
    environment:
      POSTGRES_DB: dubverse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dubverse"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dubverse-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: dubverse-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-migrator:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: dubverse-db-migrator
    environment:
      - DATABASE_URL=postgresql://postgres:password123@postgres:5432/dubverse
    depends_on:
      postgres:
        condition: service_healthy
    command: pnpm --filter @workspace/db push

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: dubverse-backend
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:password123@postgres:5432/dubverse
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=supersecretjwtkey12345!
      - AWS_ENDPOINT_URL_S3=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadminpassword
      - S3_BUCKET=dubverse-bucket
      - AWS_REGION=us-east-1
      - WHISPER_PROVIDER=mock
      - TRANSLATION_PROVIDER=mock
      - VOICE_PROVIDER=mock
      - LIPSYNC_PROVIDER=mock
      - RENDERING_PROVIDER=ffmpeg
      - START_HTTP=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      db-migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: dubverse-worker
    environment:
      - DATABASE_URL=postgresql://postgres:password123@postgres:5432/dubverse
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=supersecretjwtkey12345!
      - AWS_ENDPOINT_URL_S3=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadminpassword
      - S3_BUCKET=dubverse-bucket
      - AWS_REGION=us-east-1
      - WHISPER_PROVIDER=mock
      - TRANSLATION_PROVIDER=mock
      - VOICE_PROVIDER=mock
      - LIPSYNC_PROVIDER=mock
      - RENDERING_PROVIDER=ffmpeg
      - START_HTTP=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      db-migrator:
        condition: service_completed_successfully

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: dubverse-frontend
    depends_on:
      - backend

  gateway:
    image: nginx:alpine
    container_name: dubverse-gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
  redisdata:
  miniodata:
