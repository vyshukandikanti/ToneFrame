name: Deploy

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            dubverse/backend
            dubverse/worker
            dubverse/frontend
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=long

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: dubverse/backend:${{ github.ref_name }},dubverse/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Worker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.worker
          push: true
          tags: dubverse/worker:${{ github.ref_name }},dubverse/worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: dubverse/frontend:${{ github.ref_name }},dubverse/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify Release Deployment
        run: |
          echo "DubVerse AI release version ${{ github.ref_name }} compiled and published to DockerHub!"
