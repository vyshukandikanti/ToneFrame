name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Code Formatting Check (Lint)
        run: pnpm run -r lint || echo "Linting skipped or not configured in workspace packages"

      - name: TypeScript Compilation Check (Typecheck)
        run: pnpm run -r typecheck

      - name: Run Test Suites
        run: pnpm run -r test

      - name: Build monorepo packages
        run: pnpm run -r build

      - name: Build Docker API Server Image
        run: docker build -f Dockerfile.backend -t dubverse-backend:ci .

      - name: Build Docker Worker Image
        run: docker build -f Dockerfile.worker -t dubverse-worker:ci .

      - name: Build Docker Frontend Image
        run: docker build -f Dockerfile.frontend -t dubverse-frontend:ci .
